name: 오답노트 쓰기
description: 문제에 유형과 오답 원인을 붙이고 오답노트를 작성합니다.
title: 'annotate: '
labels: [annotate]
body:
  - type: input
    id: problem
    attributes:
      label: 문제 ID
      description: 예) pgs-42627
      placeholder: pgs-42627
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: 내 접근
      description: 처음 문제를 봤을 때 어떤 생각을 했는지
      placeholder: 처음에는 jobs를 전부 우선순위큐에 넣었다. 아직 요청되지 않은 작업까지 섞여서 틀렸다.

  - type: textarea
    id: why
    attributes:
      label: 왜 틀렸는가
      description: 한 줄에 하나씩 적어주세요. 그대로 번호 목록이 됩니다.
      placeholder: |
        현재 시각 이전에 들어온 작업만 큐에 넣어야 한다
        큐가 비면 다음 작업의 요청 시각으로 시간을 점프시켜야 한다

  - type: checkboxes
    id: mistakes
    attributes:
      label: 오답 유형
      description: 해당하는 것을 모두 고르세요.
      options:
        - label: 접근 실패
        - label: 알고리즘 선택
        - label: 자료구조 선택
        - label: 구현 오류
        - label: 시간복잡도
        - label: 문법/API

  - type: input
    id: types
    attributes:
      label: 유형 태그
      description: 쉼표로 구분. 비워두면 지금 태그를 그대로 둡니다.
      placeholder: Heap, Priority Queue

  - type: dropdown
    id: status
    attributes:
      label: 현재 상태
      options:
        - NEEDS_REVIEW
        - UNDERSTOOD
      default: 0

  - type: textarea
    id: mycode
    attributes:
      label: 내 오답 코드
      description: 틀렸던 코드를 붙여넣으면 정답 코드와 나란히 비교됩니다. 없으면 비워두세요.
      render: java
