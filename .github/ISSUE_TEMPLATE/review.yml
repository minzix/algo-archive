name: 복습 결과 기록
description: 복습 한 회차를 이력에 남기고 복습 상태를 갱신합니다.
title: 'review: '
labels: [review]
body:
  - type: input
    id: problem
    attributes:
      label: 문제 ID
      placeholder: pgs-42627
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: 이번 복습 결과
      options:
        - 아직도 접근이 어려움
        - 접근은 가능하지만 구현이 어려움
        - 완전히 이해함
      default: 2
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: 이번에 알게 된 것
      placeholder: 우선순위 조건을 세 단계로 나눠 세우는 게 핵심이었다.

  - type: input
    id: date
    attributes:
      label: 기록할 날짜
      description: YYYY-MM-DD. 비워두면 오늘로 기록합니다.
      placeholder: 2026-08-12

  - type: textarea
    id: code
    attributes:
      label: 다시 푼 코드
      description: 붙여넣으면 attempts/ 에 날짜별로 쌓입니다. 없으면 비워두세요.
      render: java
